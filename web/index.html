<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VidGrab — Video Downloader</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div class="logo">VidGrab</div>
    <div class="header-actions" id="header-actions"></div>
  </header>

  <main>
    <section class="hero">
      <h1>Unduh video dari YouTube, TikTok &amp; lainnya</h1>
      <p class="sub">Tempel link di bawah — gratis, tanpa login.</p>
      <form id="analyze-form" autocomplete="off">
        <input id="url" type="text" inputmode="url" placeholder="https://www.youtube.com/watch?v=..." required>
        <button type="submit" id="analyze-btn" class="btn primary">Analisis</button>
      </form>
      <div id="analyze-error" class="error hidden"></div>
    </section>

    <section id="result" class="card hidden">
      <div class="result-head">
        <img id="result-thumb" alt="">
        <div class="result-text">
          <div id="result-title" class="result-title"></div>
          <div id="result-meta" class="dl-meta"></div>
        </div>
      </div>
      <div id="result-chips" class="chips"></div>
      <div id="result-error" class="error hidden"></div>
      <button id="download-btn" class="btn primary wide">Unduh sekarang</button>
    </section>

    <section id="auth" class="card hidden">
      <h2 id="auth-title">Masuk</h2>
      <form id="auth-form" autocomplete="on">
        <input id="auth-email" type="email" placeholder="email" required>
        <input id="auth-pass" type="password" placeholder="password (min. 8 karakter)" required minlength="8">
        <button type="submit" id="auth-submit" class="btn primary wide">Masuk</button>
      </form>
      <div id="auth-error" class="error hidden"></div>
      <div class="auth-switch">
        <span id="auth-switch-label">Belum punya akun?</span>
        <a href="#" id="auth-toggle">Daftar</a>
      </div>
    </section>

    <section id="history">
      <h2>Riwayat unduhan</h2>
      <div id="history-list"></div>
    </section>

    <section id="pricing">
      <h2>Paket</h2>
      <div id="plan-list" class="plan-list"></div>
    </section>
  </main>

  <footer>
    <span>VidGrab — file otomatis dihapus sesuai masa retensi paket.</span>
    <span>Gunakan hanya untuk konten yang berhak Anda unduh.</span>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
